[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pmscan"
version = "0.1.0"
description = "Scan Polymarket and Kalshi for high-probability outcomes and compare their yield to T-bills"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Lucian Lonsdale" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
pmscan = "pmscan.cli:main"

[tool.setuptools.packages.find]
include = ["pmscan*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
